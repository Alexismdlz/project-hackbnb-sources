ServerRoot "/usr/local/apache2"
Listen 80

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

<IfModule unixd_module>
    User www-data
    Group www-data
</IfModule>

ServerName localhost

# Ne pas afficher la version d'Apache / de l'OS dans les en-têtes et les pages d'erreur
ServerTokens Prod
ServerSignature Off

ErrorLog /proc/self/fd/2
LogLevel warn

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b" common
    CustomLog /proc/self/fd/1 common
</IfModule>

<Directory />
    AllowOverride none
    Require all denied
</Directory>

<IfModule headers_module>
    RequestHeader unset Proxy early

    # En-têtes de sécurité
    # Le serveur de dev Vite injecte un <script> inline (react-refresh) et utilise
    # un websocket, donc la CSP est moins stricte ici que dans apache-prod.conf.
    # Elle bloque quand même les scripts externes, les plugins et l'affichage en iframe.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    # same-origin : l'URL de retour Stripe contient le secret de confirmation,
    # il ne doit pas partir dans le Referer vers un autre site (Google Fonts...)
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    # Retire l'en-tête Server renvoyé par le back (Werkzeug + version de Python)
    Header unset Server
</IfModule>

ProxyRequests Off
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"

# Back-end
ProxyPass /api/ http://back:9001/
ProxyPassReverse /api/ http://back:9001/

# Front-end
ProxyPass / http://front:9000/
ProxyPassReverse / http://front:9000/
