services:
  back:
    image: python:3
    working_dir: /app
    command: bash -c "pip3 install -r requirements.txt && python3 app.py"
    volumes:
      - ./back:/app
    environment:
      APP_ORIGIN_HOST: http://localhost:9000
      # La clé est lue dans le fichier .env (non versionné), voir .env.example
      STRIPE_API_KEY: ${STRIPE_API_KEY:?STRIPE_API_KEY manquante, copier .env.example en .env}
      # Debug désactivé par défaut, mettre FLASK_DEBUG=1 dans .env pour l'activer en local
      FLASK_DEBUG: ${FLASK_DEBUG:-0}

  front:
    image: node:22
    working_dir: /app
    command: bash -c "npm install && npm run dev -- --host"
    volumes:
      - ./front:/app

  apache:
    image: httpd:latest
    ports:
      - 9000:80
    volumes:
      - ./apache/apache-dev.conf:/usr/local/apache2/conf/httpd.conf
    depends_on:
      - back
      - front
